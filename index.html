op:2px}.skill-row h3{font-size:18px;line-height:1.25;font-weight:600;margin:0 0 6px;letter-spacing:-.015em}.skill-row .summary{font-size:14px;color:#393d39;margin:0 0 6px}.skill-row .when{font-size:15px;line-height:1.5;margin:0;color:#252925}.when-label{display:inline-block;color:var(--accent);font:700 11px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.09em;text-transform:uppercase;margin-right:8px}.empty{padding:34px 0;border-top:1px solid var(--ink);font-size:18px}.note{margin:66px 0 0;padding:20px 0;border-top:1px solid var(--ink);font-size:13px;color:#454945;max-width:760px}.note strong{display:block;color:var(--ink);font-size:16px;margin-bottom:5px}footer{max-width:var(--max);margin:auto;border-top:1px solid var(--ink);padding:18px 5vw 28px;display:flex;justify-content:space-between;gap:16px;color:var(--muted);font:500 11px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase}a{color:var(--accent)}@media(max-width:850px){.layout{grid-template-columns:1fr;gap:30px;padding-top:20px}.layout>*{min-width:0}.filter-panel{position:static;min-width:0}.jump-links{display:flex;gap:0;overflow-x:auto;max-height:none;width:100%;min-width:0;white-space:nowrap;border-bottom:1px solid var(--line)}.jump-links a{flex:0 0 auto;margin-right:20px;border:0}.jump-title{margin-top:16px}.group{margin-bottom:42px}}@media(max-width:560px){.masthead{padding:16px 20px 12px;font-size:11px;flex-wrap:wrap;gap:8px}.masthead .edition{font-size:11px}header{padding:45px 20px 28px}h1{font-size:clamp(42px,13vw,68px)}header p{margin-top:18px}.layout{padding:18px 20px 64px}.filter-row{grid-template-columns:1fr auto}.skill-row{grid-template-columns:1fr;gap:5px;padding:14px 0 16px}.skill-row h3{font-size:17px}.skill-row .when{font-size:15px}.group-head{padding:11px 0}.group h2{font-size:23px}footer{padding:15px 20px 24px;display:block}footer span{display:block;margin-top:5px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:: <body><div class="masthead"><span class="mark">H / S</span><span>Hermes · Skill Index</span><span class="edition">Field Guide / 79 Skills</span></div><header><h1>AI Skill <span>Index</span></h1><p>找到合適的 skill，從理解它能做什麼、以及何時派上用場開始。搜尋功能、情境或名稱，按類別快速瀏覽。</p></header>
<main class="layout"><aside class="filter-panel" aria-label="Skill 搜尋與導覽"><label class="control-label" for="q">搜尋目錄</label><div class="search-wrap"><input id="q" type="search" placeholder="名稱、功能或使用時機…" aria-label="搜尋 skill 名稱、功能或使用時機"></div><div class="filter-row"><div><label class="control-label" for="category">類別</label><select id="category" aria-label="依類別篩選"><option value="">所有類別</option></select></div><button id="reset" type="button">清除</button></div><div id="stats" class="stats" aria-live="polite"></div><div class="jump-title">目錄導覽</div><nav id="jump-links" class="jump-links" aria-label="符合條件的類別"></nav></aside><div id="catalog" class="catalog"></div></main><footer><span>Hermes Skill Field Guide</span><span>繁體中文 · 可搜尋 · 79 個目前可用 Skills</span></footer>
<script>
const groups=[
['程式開發與品質',[
['codebase-memory','程式碼結構查詢','要了解專案架構、符號、呼叫鏈、依賴、影響範圍或死碼時。'],['cli-tool-installation','安裝並驗證命令列工具','要從套件管理器或 GitHub 安裝 CLI，或接入 AI 助手時。'],['codebase-inspection','統計程式碼庫','要查看語言分布、程式碼行數或專案規模時。'],['dogfood','探索式測試網站','要實際操作 Web app 找錯誤，並整理重現證據時。'],['github','GitHub 工作流程','要查詢或操作 GitHub 的 PR、issue、review、repo 或登入時。'],['hermes-agent-skill-authoring','撰寫 Hermes Skill','要在 Hermes Agent 原始碼庫新增或修改 skill 時。'],['inspecting-hermes-desktop-dom','檢查 Hermes 桌面介面','要從即時 DOM/CSS 檢視 Hermes Desktop UI 時。'],['interactive-cli-authentication','CLI 瀏覽器授權','CLI 要求 device/browser authorization 時；不在聊天中索取密碼。'],['local-llm-engine-installation','安裝本機 LLM 引擎','要在本機安裝或設定大型語言模型引擎時。'],['local-model-engine-installation','macOS 本機模型安裝','要在 macOS 安裝本地模型 runtime 或模型時。'],['node-inspect-debugger','Node.js 偵錯','要用 Inspector/CDP 檢查 Node.js 程序時。'],['private-web-deployment','私密部署網站','部署網站時要確保存取受限、不公開原始碼或資料時。'],['product-prototyping','產品原型實作','要快速做產品原型並驗證核心使用流程時。'],['public-exam-curation','整理公開考題','新增公開考試試卷前，要確認來源與重用權利時。'],['python-debugpy','Python 遠端偵錯','要用 pdb 或 debugpy/DAP 追蹤 Python 程式時。'],['python-ml-environment-setup','準備 Python ML 環境','設定機器學習 Python 環境、可能涉及大型下載時。'],['requesting-code-review','提交前程式碼審查','要在 commit 前做安全、品質檢查並修正問題時。'],['simplify-code','平行精簡程式碼','要清理近期程式變更，並以多代理工作流改善可讀性時。'],['spike','快速技術驗證','先做一次性小實驗，判斷技術方案是否可行時。'],['systematic-debugging','系統化找錯','遇到程式錯誤，要先定位根因而非猜測修補時。'],['test-driven-development','測試驅動開發','新增功能或修 bug，採 RED-GREEN-REFACTOR 時。']]],
['自主代理與 Hermes',[
['claude-code','委派 Claude Code','要把功能開發或 PR 任務交由 Claude Code CLI 執行時。'],['codex','委派 Codex','要用 OpenAI Codex CLI 開發功能或處理程式任務時。'],['computer-use','桌面電腦操作','需操作圖形介面、先採背景優先的桌面控制策略時。'],['hermes-agent','設定與擴充 Hermes','要設定、使用、佈景、擴充或編排 Hermes Agent 時。'],['messaging-gateway-setup','連接聊天平台','要設定 Hermes 的訊息平台 gateway 時。'],['opencode','委派 OpenCode','要用 OpenCode CLI 開發功能或審查 PR 時。']]],
['創作、設計與視覺',[
['archify','互動式架構／流程圖','要把系統、API、資料流、狀態或日常步驟做成可探索 HTML 圖解時。'],['architecture-diagram','架構圖 SVG/HTML','要製作深色風格的系統／雲端架構圖時。'],['ascii-video','ASCII 風格影片','要將影片或音訊轉成彩色 ASCII 動畫時。'],['baoyu-infographic','資訊圖表','要用多種版型與視覺風格製作資訊圖時。'],['claude-design','單頁 HTML 設計稿','要從零設計 landing page、簡報或互動原型時。'],['design-md','設計 Token 規格','要建立、驗證或匯出 Google DESIGN.md 設計系統規格時。'],['humanizer','潤飾自然語氣','要減少制式 AI 語氣，讓文字更像自然人類撰寫時。'],['manim-video','數學／演算法動畫','要用 Manim 製作解釋概念的動畫影片時。'],['p5js','生成藝術與互動視覺','要用 p5.js 製作創意編碼、shader 或 3D 草圖時。'],['popular-web-designs','參考知名網站設計系統','要參考 Stripe、Linear、Vercel 等既有網站視覺規範時。'],['songwriting-and-ai-music','歌曲創作與音樂提示','要寫歌詞或設計 AI 音樂生成提示時。']]],
['電子郵件與訊息',[
['email-inbox-triage','收件匣整理','要替郵件排序、找優先事項或安全起草回覆時。'],['himalaya','命令列郵件','要透過 IMAP/SMTP CLI 收取、搜尋或寄送郵件時。'],['imessage','iMessage/SMS','要在 macOS 透過 imsg 收發簡訊時。'],['xurl','X/Twitter 操作','要搜尋貼文、發布內容、傳 DM 或處理媒體時。']]],
['Apple 裝置',[
['apple-notes','Apple Notes 管理','要用 memo CLI 建立、搜尋或編輯 Apple Notes 時。'],['apple-reminders','Apple 提醒事項','要新增、查看或完成 Reminders 待辦時。'],['findmy','尋找 Apple 裝置','要查找 Apple 裝置或 AirTag 時。'],['macos-input-method-installation','macOS 輸入法安裝','要安裝 macOS 輸入法時。']]],
['媒體與影音',[
['gif-search','搜尋 GIF','要從 Tenor 搜尋或下載 GIF 時。'],['songsee','音訊特徵視覺化','要分析音訊頻譜、Mel、Chroma 或 MFCC 時。'],['youtube-content','YouTube 內容整理','要取 YouTube 字幕並整理摘要、文章或社群貼文時。']]],
['筆記與知識管理',[
['obsidian','Obsidian 筆記庫','要讀取、搜尋、建立或編輯 Obsidian vault 內容時。'],['work-second-brain','pCloud 第二大腦收件','整理 pCloud 收件資料時，保留原檔並確認同步結果。']]],
['辦公與生產力',[
['airtable','Airtable 資料管理','要透過 REST API 建立、篩選、更新或 upsert Airtable 記錄時。'],['box','Box 雲端檔案','要搜尋、分享或管理 Box 檔案及 metadata 時。'],['document-to-action-items','文件義務轉待辦','要從文件抽取有引用依據的義務、期限與任務時。'],['docx','Word 文件','要建立、閱讀、編輯或校對 DOCX 文件時。'],['google-workspace','Google Workspace','要使用 Gmail、Calendar、Drive、Docs 或 Sheets 時。'],['maps','地圖與路線資訊','要查地理編碼、地點、路線或時區時。'],['meeting-action-items','會議行動項目','要從會議紀錄整理決策、負責人與任務時。'],['notion','Notion 工作區','要透過 API/CLI 建立或管理 Notion 頁面與資料庫時。'],['pdf','PDF 文件處理','要建立、讀取、合併、填表、OCR 或修改 PDF 時。'],['powerpoint','PowerPoint 簡報','要建立、閱讀或修改 .pptx 簡報時。'],['product-price-monitor','商品／航班價格監測','要追蹤商品、機票或房源價格並達標提醒時。'],['teams-meeting-pipeline','Teams 會議流程','要整理 Teams 會議摘要、重播工作或 Graph 訂閱時。'],['weekly-review-planning','每週回顧規劃','要整理本週承諾、停滯事項與下週計畫時。'],['xlsx','Excel 與 CSV','要建立、分析或編輯 XLSX/CSV 表格時。']]],
['研究與知識',[
['arxiv','搜尋學術論文','要按關鍵字、作者、分類或 ID 搜尋 arXiv 論文時。'],['competitor-news-monitor','競品新聞監測','要追蹤指定公司重大消息並產生附來源摘要時。'],['grounded-citations','可查證引用','撰寫研究或文件時，要讓主張附上可核實來源。'],['llm-wiki','建置 LLM Wiki','要建立或查詢互相連結的 Markdown 知識庫時。']]],
['網頁與取得內容',[
['blocked-page-recovery','處理被封鎖網頁','遇到 403/429、付費牆、WAF 或 bot wall 時，改用合規備援來源。']]],
['跨領域與個人化',[
['graphify','程式與文件知識圖譜','要把程式碼、文件或素材轉成可查詢圖譜，或追蹤兩個模組的關聯路徑時。'],['guizang-ppt-skill','雜誌風／瑞士風網頁簡報','要把文章、大綱或產品內容做成單一 HTML 橫向翻頁簡報，含演講者模式、備註與排練時使用。'],['i-have-adhd','清楚、易執行的回覆模式','需要先給下一步、把多步驟拆開並減少旁枝資訊時；用 /i-have-adhd 啟用。'],['impeccable','介面設計與 UX 改善','要設計、重做、檢查或改善網站與產品介面的可用性、視覺或無障礙時。'],['skill-catalog-maintenance','Skill 目錄維護','安裝、建立、移除或大幅修改 Hermes skill 後，用來同步更新本 HTML 目錄。']]],
['本地資料分析與整合',[
['google-drive-source-mapping','Google Drive 圖片來源對照','要把網站圖片連回 Google Drive 原始檔時。'],['officecli','Office 文件 CLI','要建立、檢查、校對或修改 Word/Excel/PowerPoint 文件時。'],['single-file-exam-ux-tdd','單檔考試 App UX/TDD','要以 TDD 改善單一 HTML 檔考試應用的使用體驗時。'],['video-shotcraft','產品影片分鏡製作','要以 shot recipe、真實頁面截圖與節奏剪輯製作產品影片時。']]]
];
const cat=document.querySelector('#category'),q=document.querySelector('#q'),root=document.querySelector('#catalog'),stats=document.querySelector('#stats');
for(const [name] of groups){const o=document.createElement('option');o.value=name;o.textContent=name;cat.append(o)}
function render(){const term=q.value.trim().toLocaleLowerCase(),selected=cat.value;let total=0,sections='',jumps='';groups.forEach(([name,items],index)=>{if(selected&&selected!==name)return;const matches=items.filter(([id,title,when])=>`${id} ${title} ${when} ${name}`.toLocaleLowerCase().includes(term));if(!matches.length)return;total+=matches.length;const sectionId=`category-${index}`;jumps+=`<a href="#${sectionId}"><span>${name}</span><span>${String(matches.length).padStart(2,'0')}</span></a>`;sections+=`<section class="group" id="${sectionId}"><div class="group-head"><h2>${name}</h2><span class="group-count">${String(matches.length).padStart(2,'0')} SKILLS</span></div><div class="skill-list">${matches.map(([id,title,when])=>`<article class="skill-row"><code class="skill-id">${id}</code><div><h3>${title}</h3><p class="when"><span class="when-label">何時使用</span>${when}</p></div></article>`).join('')}</div></section>`});root.innerHTML=sections||'<div class="empty">沒有符合條件的 Skill。請調整關鍵字或清除篩選。</div>';document.querySelector('#jump-links').innerHTML=jumps;stats.textContent=`${total} 個符合條件${term||selected?'':' · 共 '+groups.reduce((n,g)=>n+g[1].length,0)+' 個目前可用'}`;}
q.addEventListener('input',render);cat.addEventListener('change',render);document.querySelector('#reset').addEventListener('click',()=>{q.value='';cat.value='';render();q.focus()});render();
</script></body></html>
